[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aidriven"
version = "0.1.0"
description = "LLM test bench: reliability, performance, conformity and intelligence across models."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Hendrick Castro" }]
dependencies = [
    "nicegui>=3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "anthropic>=0.60",
    "openai>=1.99",
    "google-genai>=1.30",
    "firebase-admin>=6.6",
    "docker>=7.1",
    "keyring>=25.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "cryptography>=42",  # encrypts API keys stored in Firestore (ADR-022)
]

[project.optional-dependencies]
# Headless-browser checks without Docker (process sandbox). Then: python -m playwright install chromium
html = ["playwright>=1.50"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
aidriven = "aidriven.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aidriven"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = [
    "PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF001", "RUF002", "RUF003",
    "PLC0415",  # lazy imports keep optional SDKs (firebase, docker, genai) off the startup path
    "PLW0603", "SIM105", "UP047", "PLR0917", "PLR0914", "PLR1702", "PLR6301", "B023",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"src/aidriven/seed/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["aidriven"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
# `lambda: (a(), b())` is the NiceGUI idiom for multi-step handlers
disable_error_code = ["func-returns-value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "docker: requires the Docker daemon",
    "firestore: requires Firestore credentials",
]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:google.genai.*"]
