slug: login-streaks-sql
title: Longest login streaks in UTC with SQL (gaps and islands)
category: sql
difficulty: hard
expected_artifact: sql
artifact_names:
- query.sql
tags:
- sql
- sqlite
- window-functions
- gaps-and-islands
- timezones
prompt: |
  Write ONE SQLite query (SQLite 3.31+, window functions allowed, CTEs allowed) for this schema:

  ```sql
  CREATE TABLE users (id INTEGER PRIMARY KEY, username TEXT NOT NULL UNIQUE);
  CREATE TABLE logins (
    id INTEGER PRIMARY KEY,
    user_id INTEGER NOT NULL REFERENCES users(id),
    ts TEXT NOT NULL,          -- ISO-8601 local time WITH offset, e.g. '2024-03-01T23:30:00-05:00' or '2024-03-02T04:30:00Z'
    success INTEGER NOT NULL   -- 1 = successful login, 0 = failed attempt
  );
  ```

  A user's *active days* are the UTC calendar dates on which the user has at least one successful login (convert
  each timestamp to UTC before taking its date; failed attempts do not count). A *streak* is a maximal run of
  consecutive active days. For every user, find their longest streak; if a user has several streaks of that same
  maximal length, take the earliest one.

  Return exactly these columns, in this order:
  1. `username`
  2. `streak_days` - length in days of the longest streak (0 if the user has no successful login at all)
  3. `streak_start` - first UTC date of that streak as text 'YYYY-MM-DD' (NULL if none)
  4. `streak_end` - last UTC date of that streak as text 'YYYY-MM-DD' (NULL if none)
  5. `logins_in_streak` - number of successful logins (rows, not days) inside that streak (0 if none)
  6. `rnk` - dense rank of users by `streak_days`, highest first (ties share a rank; users with 0 are ranked too)

  Every user in `users` appears exactly once, including users with no logins or only failed logins.
  Order the rows by `streak_days` descending, then `username` ascending.

  The query will be executed as-is (one statement, no temporary tables, no parameters) against a hidden dataset
  with this schema. Deliver it as `query.sql`.
rubric: |
  Score 1-10. Correct UTC conversion of offset timestamps (date(ts) in SQLite normalises the offset),
  deduplication to active days while counting login rows, a correct gaps-and-islands grouping (date minus
  row_number), tie-break on the earliest streak, LEFT JOIN so every user appears with 0/NULL defaults,
  DENSE_RANK (not RANK), exact column order/names and ordering, single read-only statement, readability.
reference_answer: |
  WITH ok AS (
      SELECT user_id, date(ts) AS d
      FROM logins
      WHERE success = 1
  ),
  days AS (
      SELECT user_id, d, COUNT(*) AS n
      FROM ok
      GROUP BY user_id, d
  ),
  grouped AS (
      SELECT user_id, d, n,
             julianday(d) - ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY d) AS grp
      FROM days
  ),
  streaks AS (
      SELECT user_id, MIN(d) AS s, MAX(d) AS e, COUNT(*) AS len, SUM(n) AS logins
      FROM grouped
      GROUP BY user_id, grp
  ),
  best AS (
      SELECT user_id, s, e, len, logins,
             ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY len DESC, s ASC) AS rn
      FROM streaks
  ),
  per_user AS (
      SELECT u.username,
             COALESCE(b.len, 0) AS streak_days,
             b.s AS streak_start,
             b.e AS streak_end,
             COALESCE(b.logins, 0) AS logins_in_streak
      FROM users u
      LEFT JOIN best b ON b.user_id = u.id AND b.rn = 1
  )
  SELECT username, streak_days, streak_start, streak_end, logins_in_streak,
         DENSE_RANK() OVER (ORDER BY streak_days DESC) AS rnk
  FROM per_user
  ORDER BY streak_days DESC, username ASC;
