<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exact Rational Calculator</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1d2330; --muted: #6b7385; --accent: #2f6fec; --err: #c62828; --line: #dde1e8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171d; --panel: #1d222b; --ink: #e8ebf1; --muted: #9aa3b5; --accent: #6f9dff; --err: #ff7b7b; --line: #2c333f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(560px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line);
         border-radius: 14px; padding: 24px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  p.hint { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: 1.05rem ui-monospace, "Cascadia Code", Consolas, monospace; padding: 10px 12px;
          border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .result { margin: 16px 0 8px; min-height: 2.2em; font: 1.4rem ui-monospace, Consolas, monospace; overflow-wrap: anywhere; display: block; }
  .result.error { color: var(--err); }
  h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
  ol { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  li { padding: 8px 4px; border-bottom: 1px solid var(--line); font-family: ui-monospace, Consolas, monospace; cursor: pointer; overflow-wrap: anywhere; }
  li:hover, li:focus { background: color-mix(in srgb, var(--accent) 10%, transparent); outline: none; }
</style>
</head>
<body>
<main>
  <h1>Exact rational calculator</h1>
  <p class="hint">Operators <code>+ - * / ^</code>, parentheses and unary minus. Results are exact fractions.</p>
  <form id="calc" autocomplete="off">
    <label for="expr" class="visually-hidden" hidden>Expression</label>
    <input id="expr" name="expr" placeholder="e.g. (1/3 + 1/6) ^ -2" aria-label="Expression" spellcheck="false">
    <button id="eval" type="submit">=</button>
  </form>
  <output id="result" class="result" aria-live="polite" for="expr"></output>
  <h2>History</h2>
  <ol id="history" aria-label="History (click to reuse)"></ol>
</main>
<script>
"use strict";
class CalcError extends Error {}

function gcd(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { [a, b] = [b, a % b]; } return a; }
function rat(n, d = 1n) {
  if (d === 0n) throw new CalcError("division by zero");
  if (d < 0n) { n = -n; d = -d; }
  const g = gcd(n, d) || 1n;
  return { n: n / g, d: d / g };
}
const add = (a, b) => rat(a.n * b.d + b.n * a.d, a.d * b.d);
const sub = (a, b) => rat(a.n * b.d - b.n * a.d, a.d * b.d);
const mul = (a, b) => rat(a.n * b.n, a.d * b.d);
const div = (a, b) => { if (b.n === 0n) throw new CalcError("division by zero"); return rat(a.n * b.d, a.d * b.n); };
function pow(a, e) {
  if (e.d !== 1n) throw new CalcError("non-integer exponent");
  let k = e.n;
  if (k > 10000n || k < -10000n) throw new CalcError("exponent too large");
  if (k < 0n) { if (a.n === 0n) throw new CalcError("division by zero"); a = rat(a.d, a.n); k = -k; }
  return rat(a.n ** k, a.d ** k);
}
function fmt(r) { return r.d === 1n ? r.n.toString() : `${r.n}/${r.d}`; }

function tokenize(src) {
  const toks = [];
  const re = /\s*(?:(\d+(?:\.\d+)?)|([-+*/^()]))/y;
  let i = 0;
  while (i < src.length) {
    if (/^\s*$/.test(src.slice(i))) break;
    re.lastIndex = i;
    const m = re.exec(src);
    if (!m) throw new CalcError("unexpected character");
    if (m[1] !== undefined) {
      const [ip, fp = ""] = m[1].split(".");
      toks.push({ t: "num", v: rat(BigInt(ip + fp), 10n ** BigInt(fp.length)) });
    } else toks.push({ t: m[2] });
    i = re.lastIndex;
    if (m[1] !== undefined && /^[\d.]/.test(src.slice(i))) throw new CalcError("bad number");
  }
  return toks;
}

function evaluate(src) {
  const toks = tokenize(src);
  let pos = 0;
  const peek = () => (pos < toks.length ? toks[pos].t : null);
  const expect = (t) => { if (peek() !== t) throw new CalcError("expected " + t); pos++; };
  function expr() {
    let v = term();
    while (peek() === "+" || peek() === "-") { const op = toks[pos++].t; const r = term(); v = op === "+" ? add(v, r) : sub(v, r); }
    return v;
  }
  function term() {
    let v = unary();
    while (peek() === "*" || peek() === "/") { const op = toks[pos++].t; const r = unary(); v = op === "*" ? mul(v, r) : div(v, r); }
    return v;
  }
  function unary() {
    if (peek() === "-") { pos++; const v = unary(); return rat(-v.n, v.d); }
    return power();
  }
  function power() {
    const base = primary();
    if (peek() === "^") { pos++; return pow(base, unary()); }
    return base;
  }
  function primary() {
    const t = peek();
    if (t === "num") return toks[pos++].v;
    if (t === "(") { pos++; const v = expr(); expect(")"); return v; }
    throw new CalcError("unexpected token");
  }
  if (!toks.length) throw new CalcError("empty");
  const v = expr();
  if (pos !== toks.length) throw new CalcError("trailing input");
  return v;
}

const form = document.getElementById("calc");
const input = document.getElementById("expr");
const out = document.getElementById("result");
const hist = document.getElementById("history");

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const src = input.value.trim();
  let text;
  try {
    text = fmt(evaluate(src));
  } catch (e) {
    if (!(e instanceof CalcError) && !(e instanceof RangeError)) console.error(e);
    out.textContent = "Error";
    out.classList.add("error");
    return;
  }
  out.textContent = text;
  out.classList.remove("error");
  const li = document.createElement("li");
  li.textContent = `${src} = ${text}`;
  li.tabIndex = 0;
  li.dataset.expr = src;
  hist.prepend(li);
  while (hist.children.length > 10) hist.lastElementChild.remove();
});

function reuse(li) { input.value = li.dataset.expr; input.focus(); }
hist.addEventListener("click", (ev) => { const li = ev.target.closest("li"); if (li) reuse(li); });
hist.addEventListener("keydown", (ev) => { const li = ev.target.closest("li"); if (li && ev.key === "Enter") reuse(li); });
</script>
</body>
</html>
